# Baut die Firmware für beide CYD-Varianten und stellt sie als
# Einzeldatei (Adresse 0x0) im Release "firmware" bereit.
name: Firmware bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install platformio esptool==4.8.1 requests

      - name: Monat bestimmen (fuer die Strassenliste)
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Strassenliste aus dem Zwischenspeicher
        id: streets
        uses: actions/cache/restore@v4
        with:
          path: include/streets_data.h
          key: streets-ead-${{ steps.month.outputs.month }}

      - name: Strassenliste EAD Darmstadt erzeugen (Muellmax)
        id: gen
        if: steps.streets.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python tools/make_streets.py

      - name: Strassenliste zwischenspeichern
        if: steps.gen.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: include/streets_data.h
          key: streets-ead-${{ steps.month.outputs.month }}

      - name: Strassenliste pruefen
        run: head -c 300 include/streets_data.h; echo; grep -o "STREETS_GZ_LEN = [0-9]*" include/streets_data.h

      - name: Kompilieren
        run: pio run -e cyd -e cyd2usb

      - name: Einzeldateien zum Flashen erzeugen
        run: |
          mkdir -p out
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          for env in cyd cyd2usb; do
            B=.pio/build/$env
            esptool.py --chip esp32 merge_bin -o out/cyd-abfahrt-v2-$env.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: cyd-abfahrt-v2-firmware
          path: out/*.bin

      - name: Release "firmware" aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Fertige Firmware zum Flashen an Adresse 0x0 (siehe README, Abschnitt 'Flashen im Browser'). Stand: ${GITHUB_SHA::7}"
          if gh release view firmware >/dev/null 2>&1; then
            gh release edit firmware --notes "$NOTES"
          else
            gh release create firmware --title "Aktuelle Firmware" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload firmware out/*.bin --clobber

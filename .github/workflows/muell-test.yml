# Manuell startbar: prueft den Muellmax-Abruf (EAD Darmstadt) wie die Firmware
name: Muellkalender testen

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/test_muell.py
